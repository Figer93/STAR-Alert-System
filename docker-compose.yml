version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: star_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./alerts.db:/app/alerts.db
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./alerts.db
    networks:
      - star_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: star_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - PORT=80
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - star_net

networks:
  star_net:
    driver: bridge
