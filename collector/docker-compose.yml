# STAR Alert System — Network Collector Stack
# Runs on any machine inside the office network.
# Copy .env.example to .env, fill in all values, then:
#   docker compose up -d

version: "3.8"

services:

  # ── goflow2: receives NetFlow v5/v9/IPFIX from pfSense ─────────────────────
  # Listens on UDP ${NETFLOW_PORT} and writes JSON lines to a shared volume.
  # The goflow2_parser sidecar tails that file and inserts into the buffer.
  #
  # NOTE: direct PostgreSQL output is not available in all goflow2 builds.
  # We therefore use the -transport=file approach and a Python sidecar.
  # If your goflow2 image does not support -transport=file, replace the
  # command block with:
  #   command: sh -c 'goflow2 -netflow.enabled=true -netflow.port=9995 >> /data/flows.jsonl'
  goflow2:
    image: netsampler/goflow2:latest
    restart: unless-stopped
    ports:
      - "${NETFLOW_PORT:-9995}:9995/udp"
    command:
      - -netflow.enabled=true
      - -netflow.port=9995
      - -transport=file
      - -transport.file.path=/data/flows.jsonl
    volumes:
      - goflow_data:/data
    networks:
      - collector_net

  # ── goflow2_parser: tails goflow2 JSON → buffer → Railway backend ──────────
  goflow2_parser:
    build: ./services/goflow2_parser
    restart: unless-stopped
    depends_on:
      - goflow2
    environment:
      BACKEND_URL: ${BACKEND_URL}
      FLOWS_FILE: /data/flows.jsonl
      BATCH_SIZE: "100"
      BATCH_INTERVAL: "2.0"
      # Buffer DB lives in /buffer so it doesn't conflict with the goflow_data
      # volume that is already mounted at /data for flows.jsonl.
      BUFFER_DB_PATH: /buffer/buffer.db
    volumes:
      - goflow_data:/data
      - buffer_data:/buffer
      - ./buffer.py:/app/buffer.py:ro
    networks:
      - collector_net

  # ── telegraf: ICMP ping → collector buffer → Railway backend ──────────────
  # UniFi polling is handled by the unifi_poller service below.
  telegraf:
    image: telegraf:latest
    restart: unless-stopped
    cap_add:
      - NET_RAW
    environment:
      GATEWAY_IP: ${GATEWAY_IP}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - collector_net

  # ── unifi_poller: polls UniFi Controller → buffer → Railway backend ────────
  unifi_poller:
    build: ./services/unifi_poller
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL}
      UNIFI_URL: ${UNIFI_URL}
      UNIFI_PORT: ${UNIFI_PORT:-8443}
      UNIFI_USER: ${UNIFI_USER}
      UNIFI_PASS: ${UNIFI_PASS}
      UNIFI_SITE: ${UNIFI_SITE:-default}
      UNIFI_VERIFY_SSL: ${UNIFI_VERIFY_SSL:-false}
      POLL_INTERVAL: "60"
    volumes:
      - buffer_data:/data
      - ./buffer.py:/app/buffer.py:ro
    networks:
      - collector_net

  # ── fping_collector: LAN latency monitoring only ───────────────────────────
  # Pings LAN targets only (WAN monitoring is handled by Railway backend).
  # Requires NET_RAW capability to send ICMP packets.
  fping_collector:
    build: ./services/fping_collector
    restart: unless-stopped
    cap_add:
      - NET_RAW
    environment:
      BACKEND_URL: ${BACKEND_URL}
      INTERNAL_IPS: ${INTERNAL_IPS:-10.2.1.253,10.2.1.5,10.2.1.3,10.2.2.100}
      FPING_INTERVAL: "30"
    volumes:
      - buffer_data:/data
      - ./buffer.py:/app/buffer.py:ro
    networks:
      - collector_net

  # ── health_reporter: heartbeat + silent-source detection ───────────────────
  # Posts heartbeat to Railway backend /api/collector/heartbeat.
  health_reporter:
    build: ./services/health_reporter
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL}
      COLLECTOR_ID: ${COLLECTOR_ID:-office-main}
      REPORT_INTERVAL: "60"
    volumes:
      - ./buffer.py:/app/buffer.py:ro
    networks:
      - collector_net

volumes:
  goflow_data:    # shared between goflow2 and goflow2_parser
  buffer_data:    # persistent SQLite buffer for all collector services

networks:
  collector_net:
    driver: bridge
