# Telegraf configuration for STAR Network Collector
# Collects: ICMP latency for infrastructure targets (gateway, 8.8.8.8, 1.1.1.1)
# Outputs:  Supabase REST API → latency_metrics table
#
# NOTE: UniFi polling is handled by the unifi_poller Python service.
#       outputs.postgresql is not used because Supabase DNS
#       (db.xxxx.supabase.co) does not resolve inside Docker.
#       The REST API (HTTPS to supabase.co) is used instead.
#
# Environment variables (passed by docker-compose.yml):
#   SUPABASE_URL  — https://<project>.supabase.co
#   SUPABASE_KEY  — service role key
#   GATEWAY_IP    — office gateway IP, e.g. 192.168.1.1

[agent]
  interval          = "60s"
  round_interval    = true
  metric_batch_size = 1000
  flush_interval    = "10s"
  omit_hostname     = true


# ── Processors ────────────────────────────────────────────────────────────────
# Rename measurement + fields/tags so the JSONata transformation below can
# reference predictable names.

[[processors.rename]]
  [[processors.rename.replace]]
    measurement = "ping"
    dest        = "latency_metrics"

  [[processors.rename.replace]]
    tag   = "url"               # telegraf ping tags the target as 'url'
    dest  = "target_name"

  [[processors.rename.replace]]
    field = "average_response_ms"
    dest  = "rtt_ms"

  [[processors.rename.replace]]
    field = "percent_packet_loss"
    dest  = "packet_loss_pct"


# ── Inputs ────────────────────────────────────────────────────────────────────

[[inputs.ping]]
  ## fping_collector covers all device_registry IPs; telegraf covers fixed
  ## infrastructure targets only (gateway + public DNS).
  urls = ["${GATEWAY_IP}", "8.8.8.8", "1.1.1.1"]

  count         = 3      # probes per cycle
  ping_interval = 0.5    # seconds between probes
  timeout       = 2.0    # seconds to wait for reply
  deadline      = 10     # total seconds before giving up
  method        = "native"  # privileged ICMP — container needs NET_RAW cap

  interval = "30s"

  [inputs.ping.tags]
    target_type = "infrastructure"


# ── Outputs ───────────────────────────────────────────────────────────────────

[[outputs.http]]
  url    = "${SUPABASE_URL}/rest/v1/latency_metrics"
  method = "POST"

  ## Only send latency_metrics measurements (renamed from "ping" above).
  namepass = ["latency_metrics"]

  ## Send all buffered metrics in one request so PostgREST receives a JSON
  ## array and can bulk-insert in a single transaction.
  use_batch_format = true

  data_format          = "json"
  json_timestamp_units = "1s"   # timestamp in the JSONata input is Unix seconds

  ## JSONata transformation (telegraf >= 1.23).
  ## Reshapes telegraf's native {name, tags, fields, timestamp} envelope into
  ## the flat row format that PostgREST (Supabase REST API) expects.
  ## target_ip equals target_name because inputs.ping urls are bare IPs.
  json_transformation = """
$map($, function($v) {
  {
    "time":            $fromMillis($v.timestamp * 1000),
    "target_name":     $v.tags.target_name,
    "target_ip":       $v.tags.target_name,
    "target_type":     $v.tags.target_type,
    "rtt_ms":          $v.fields.rtt_ms,
    "packet_loss_pct": $v.fields.packet_loss_pct
  }
})
"""

  [outputs.http.headers]
    Content-Type  = "application/json"
    apikey        = "${SUPABASE_KEY}"
    Authorization = "Bearer ${SUPABASE_KEY}"
    Prefer        = "return=minimal"
