# Telegraf configuration for STAR Network Collector
# Collects: UniFi switch port stats, connected-client inventory, ICMP latency
# Outputs:  Supabase PostgreSQL (switch_port_metrics, device_registry, latency_metrics)
#
# Environment variables (passed by docker-compose.yml):
#   SUPABASE_DATABASE_URL  — postgresql://user:pass@host:5432/postgres
#   UNIFI_URL              — https://192.168.1.1
#   UNIFI_PORT             — 8443
#   UNIFI_USER / UNIFI_PASS
#   UNIFI_SITE             — default
#   UNIFI_VERIFY_SSL       — false
#   GATEWAY_IP             — 192.168.1.1

[agent]
  interval         = "60s"
  round_interval   = true
  metric_batch_size = 1000
  flush_interval   = "10s"
  omit_hostname    = true   # host metric is not meaningful inside a container

# ── Processors ────────────────────────────────────────────────────────────────
# Rename measurements and fields so they match our Supabase schema exactly.
# Order matters: rename.replace runs top-to-bottom.

[[processors.rename]]
  # Rename measurements
  [[processors.rename.replace]]
    measurement = "unifi_port"
    dest        = "switch_port_metrics"

  [[processors.rename.replace]]
    measurement = "unifi_client"
    dest        = "device_registry_snapshot"   # treated as upsert in device_registry

  [[processors.rename.replace]]
    measurement = "ping"
    dest        = "latency_metrics"

  # switch_port_metrics field/tag renames
  [[processors.rename.replace]]
    tag  = "mac"         # switch MAC used as switch_id
    dest = "switch_id"

  [[processors.rename.replace]]
    tag  = "device_name"
    dest = "switch_name"

  [[processors.rename.replace]]
    field = "poe_power"
    dest  = "poe_watts"

  # latency_metrics renames (from inputs.ping)
  [[processors.rename.replace]]
    tag   = "url"        # telegraf ping uses 'url' for the target
    dest  = "target_name"

  [[processors.rename.replace]]
    field = "average_response_ms"
    dest  = "rtt_ms"

  [[processors.rename.replace]]
    field = "percent_packet_loss"
    dest  = "packet_loss_pct"


# ── Inputs ────────────────────────────────────────────────────────────────────

[[inputs.unifi]]
  ## UniFi Controller address and credentials.
  ## Create a read-only local account in UniFi — see README for steps.
  url      = "${UNIFI_URL}:${UNIFI_PORT}"
  username = "${UNIFI_USER}"
  password = "${UNIFI_PASS}"
  site     = "${UNIFI_SITE}"

  ## UniFi uses a self-signed certificate by default.
  insecure_skip_verify = true   # set to false if you have a valid cert

  ## Collect port-level stats (switch_port_metrics after rename above).
  collect_port_stats = true

  ## Collect connected-station data (device_registry_snapshot after rename above).
  ## Note: this gives a point-in-time snapshot; the Python fping_collector
  ## performs the actual upsert into device_registry.
  collect_station_stats = true

  interval = "60s"


[[inputs.ping]]
  ## Targets: gateway + well-known DNS resolvers.
  ## fping_collector covers all device_registry IPs; telegraf covers infra targets.
  urls = ["${GATEWAY_IP}", "8.8.8.8", "1.1.1.1"]

  count          = 3       # pings per measurement cycle
  ping_interval  = 0.5     # seconds between pings
  timeout        = 2.0     # seconds to wait for reply
  deadline       = 10      # total seconds before giving up
  method         = "native" # uses privileged ICMP; container needs NET_RAW cap

  interval = "30s"

  ## Tag each target with its type so it maps to our latency_target_type_enum.
  ## telegraf does not support per-URL tags natively; add them via the
  ## [[processors.override]] trick below.
  [inputs.ping.tags]
    target_type = "infrastructure"   # overridden per-target if needed


# ── Outputs ───────────────────────────────────────────────────────────────────
# One PostgreSQL output block per destination table, filtered by measurement name.
# Telegraf creates the table if it does not exist — but our tables are already
# created by the Alembic migration, so set create_templates = [] to skip DDL.

[[outputs.postgresql]]
  ## Connection string from docker-compose env (Supabase direct connection URL).
  connection = "${SUPABASE_DATABASE_URL}"

  ## Write switch port metrics — measurement renamed above.
  namepass = ["switch_port_metrics"]

  ## Columns to exclude that telegraf adds by default but are not in our schema.
  exclude_columns = ["host"]

  ## Disable auto-DDL; our schema is already in place.
  create_templates = []


[[outputs.postgresql]]
  connection = "${SUPABASE_DATABASE_URL}"

  namepass = ["latency_metrics"]

  exclude_columns = ["host", "result", "result_code", "ttl",
                     "maximum_response_ms", "minimum_response_ms",
                     "packets_transmitted", "packets_received",
                     "standard_deviation_ms", "errors_percent"]

  create_templates = []

# NOTE: device_registry_snapshot is intentionally NOT written via telegraf.
# The fping_collector Python service performs full device_registry upserts
# (it has access to supabase-py upsert semantics with on_conflict handling).
# Telegraf's postgresql output does INSERT only, which would duplicate rows.
